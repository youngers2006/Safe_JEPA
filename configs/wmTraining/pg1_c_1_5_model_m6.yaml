#  run
seed: 0
dataset_filename: "src/datasets/FilteredSafetyPointGoal1Gymnasium_v0_100_2022.hdf5"
data_dir: "M6_pointgoal1_c_1_5_seed_0"        # one subdir per sweep point
obs_type: "state"
val_frac: 0.1 # split by TRAJECTORY, not transition

epochs: 150
num_batches: 1000 # ~= n_transitions / batch_size
batch_size: 256
lr: 3.0e-4
train_horizon: 10 # consecutive transitions per training window (1 = one-step training, as before)
rho: 0.9 # weight rho^t on the losses at rollout step t

# problem 
d_latent: 32
discount: 0.99
action_bounds: [-1.0, 1.0]
margin_sources: [[28, 44, 0.2]] # [First Lidar column, Last Lidar column + 1, contact distance]
margin_clip: 1.0 # margins above this are trained as this: the barrier cannot bind this far from a hazard
margin_edge_weight: 4.0 # rows near a hazard edge weigh 1 + margin_edge_weight * exp(-margin / margin_edge_scale)
margin_edge_scale: 0.2
dense_reward: true # the reward head learns only the dense reward; the goal bonus is left to the value function
goal_threshold: 0.5 # reward above this marks a step that reached the goal (the dataset has no goal flag)
goal_reward: 1.0 # Safety-Gymnasium's goal bonus

# loss weights
lambda_dyn: 1.0
lambda_v: 0.5
lambda_r: 1.0
lambda_m: 1.0
lambda_var: 1.0
lambda_cov: 0.04
gamma: 0.5 # VICReg variance target, tanh latent compression requires this be 0-0.5 to be reachable
ER_tau: 0.7

tau: [0.01, 0.005] # (encoder, value)

#  sub-networks
EncoderParams:
  d_hidden: 256
  in_channels: 3 # vision only

DynamicsParams:
  hidden_features: [256, 256]
  lipschitz_bound: 1.5 # inf turns lipschitz bounding off

ValueParams:
  hidden_features: [256, 256]
  lipschitz_bound: 1.5

ValueQParams:
  hidden_features: [256, 256]

RewardParams:
  hidden_features: [256, 256]
  lipschitz_bound: 1.5
  two_hot: false # true: the reward as a distribution over bins in symlog space, by cross-entropy (DreamerV3, TD-MPC2); use lambda_r 0.1
  num_bins: 101
  vmin: -1.0 # bin range in symlog space
  vmax: 1.0

MarginParams:
  hidden_features: [256, 256]
  lipschitz_bound: 1.5