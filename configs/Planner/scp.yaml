controller: "SCP"
w_slack: 10000.0 # penalty on dynamics and safety slack
w_prox: 1.0 # initial trust region weight
scp_iters: 20 # scp max iters per timestep
tol: 1.0e-2 # early stopping criteria: stop once the prox-linear stationarity measure is below this fraction of its first-iteration value
rho_lower: 0.25 # reject and tighten trust region threshold
rho_upper: 0.75 # loosen traust region threshold