controller: "SCP"
w_slack: 10000.0 # penalty on safety slack
w_dyn: 1000000.0 # L1 penalty on the dynamics slack (virtual control)
w_prox: 1.0 # initial trust region weight
scp_iters: 20 # scp max iters per timestep
tol: 1.0e-3 # early stopping criteria (absolute tolerance on the prox-gradient norm)
tol_pred: 1.0e-5 # also stop once the subproblem's predicted decrease is below this times max(1, |J|)
rho_lower: 0.25 # reject and tighten trust region threshold
rho_upper: 0.75 # loosen traust region threshold